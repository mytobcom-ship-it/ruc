#========================================================================
# RUC 위치검증								(맵매칭) 서버 환경설정
# 기본값 상수: src/ConfigDefaults.h						(CFG_DEF_<키약어>)
#========================================================================

# id                                 - PROC_SERVERSTATUS.SERVER_ID         (기본: CFG_DEF_SERVER_ID="location")
# status_interval                    - CPU/메모리 하트비트 주기 sec, 0=비활성 (기본: CFG_DEF_STATUS_INTVL=600)
#                                     (2026-08-20 최정우 추가 — CServer::UpdateServerStatus() 가 사용)
[server]
id=location
status_interval=5
# stale_sec              - 좀비 PROCESSING(2) 회수 주기 겸 임계 sec, 0=비활성 (기본 600)
#                                     예약 시각(MATCH_RSV_DT)이 이 값보다 오래된 행만 PENDING(0)으로 회수.
#                                     엔진 강제 종료·배치 실패로 2 에 갇힌 행이 재기동까지 방치되는 것을 막는다.
#                                     ※ ttl_sec 이상이어야 한다 — 미만이면 세션 보류(1틱 지연커밋) 행을
#                                       세션이 살아있는 동안 회수해 같은 GPS 를 두 번 처리한다.
#                                       미만으로 두면 기동 시 ttl_sec 으로 자동 상향(경고 로그).
#                                     (2026-08-29 최정우 추가)
stale_sec=3600

# path                              - 로그 경로                          (기본: CFG_DEF_PATH=./log)
# level                             - 로그 레벨 0~4                      (기본: CFG_DEF_LEVEL=2)
# runtime                           - 로그 정리 시각 0~23, -1=미사용     (기본: CFG_DEF_RUNTIME=-1)
# keepday                           - 로그 보관 일수                     (기본: CFG_DEF_KEEPDAY=7)
[log]
path=./log
level=2
runtime=0
keepday=7

# host                              - DB 호스트                           (기본: CFG_DEF_HOST=)
# port                              - DB 포트                             (기본: CFG_DEF_PORT=5432)
# userid                            - DB 사용자                           (기본: CFG_DEF_USERID=postgres)
# password                          - DB 비밀번호                         (기본: CFG_DEF_PASSWORD=postgres)
# minconnect                        - 풀 최소 연결                        (기본: CFG_DEF_MINCONNECT=3)
# maxconnect                        - 풀 최대 연결, 0=자동                (기본: CFG_DEF_MAXCONNECT=0)
# retrymax                          - 연결 재시도 횟수                    (기본: CFG_DEF_CONN_RETRY_MAX=3)
# retrywait                         - 연결 재시도 대기 ms                 (기본: CFG_DEF_CONN_RETRY_WAIT=100)
[database]
host=127.0.0.1
port=5432
name=ruc
userid=mytobcom
password=my664761
minconnect=11
maxconnect=13
retrymax=3
retrywait=100

[query]
file=./query.sql

# gate_select                       - 과금 게이트(BASE_TOLLGATE) 전량 조회 (선택, 비우면 CChargeDataLoader 게이트 캐시 비활성)
#                                     (2026-08-12 최정우 추가 — CChargeDataLoader::LoadGates() 가 사용)
# zone_select                       - 과금 구역(BASE_ROADLINK) 전량 조회  (선택, 비우면 CChargeDataLoader 구역 캐시 비활성)
#                                     (2026-08-12 최정우 추가 — CChargeDataLoader::LoadZones() 가 사용)
# parkfine_select                   - 주정차 과태료(BASE_PARKING_FINE) 최소 FROM_MIN 조회 (선택, 비우면 체류시간 임계 비활성)
#                                     (2026-08-24 최정우 추가 — CChargeDataLoader::LoadParkingFine() 가 사용)
# charge_insert                     - 과금 적재                           (선택, 비우면 비활성)
# trip_end                          - 트립 종료 시 trip_end_dt UPDATE     (선택, 비우면 비활성)
#                                     (2026-08-12 최정우 추가 — CRawLogWorker::UpdateTripEndDt() 가 사용)
# trip_abend                        - TTL 만료(비정상 종료) 시 4유형(개방형/폐쇄형/구간단속/면제도로) 미확정
#                                     레코드 마감 UPDATE (선택, 비우면 비활성) — 주정차는 별도 경로(park_ttl)
#                                     (2026-08-13 최정우 추가 — CRawLogWorker::UpdateAbnormalTripEnd() 가 사용)
# server_status                      - 서버 상태(CPU/메모리) 하트비트 UPDATE (선택, 비우면 비활성)
#                                     (2026-08-20 최정우 추가 — CServer::UpdateServerStatus() 가 사용)
[sql]
rawlog_recover=rawgps_recover
# stale_recover                     - 좀비 PROCESSING(2) 운영 중 회수 SQL (선택, 비우면 기동 시 1회 복구만 동작)
#                                     (2026-08-29 최정우 추가 — CServer::RecoverStaleProcessing() 이 사용)
stale_recover=stale_recover
rawlog_select=rawgps_select
rawlog_update=rawgps_update
gate_select=gate_select
zone_select=zone_select
parkfine_select=parkfine_select
charge_insert=charge_insert
trip_end=trip_end
trip_abend=trip_abend
trip_seqoff=trip_seqoff
trip_seqfin=trip_seqfin
server_status=server_status

# limit                             - 1회 fetch 건수                      (기본: CFG_DEF_LIMIT=500)
# fetch_interval                    - poll 주기 ms                        (기본: CFG_DEF_FETCH_INTVL=500)
# queue_pause                       - 큐>= 시 poll 중단(건수)             (기본: CFG_DEF_Q_PAUSE_CNT=400)
# queue_max                         - 큐>= 시 최대 sleep(건수)            (기본: CFG_DEF_Q_MAX_CNT=800)
# queue_busymin                     - backpressure 최소 ms                (기본: CFG_DEF_Q_BUSY_MIN=2000)
# queue_busymax                     - poll 최대 대기 ms                   (기본: CFG_DEF_Q_BUSY_MAX=10000)
[feeder]
limit=500
fetch_interval=500
queue_pause=400
queue_max=800
queue_busymin=2000
queue_busymax=10000

# ttl_sec                           - 세션 TTL sec                        (기본: CFG_DEF_TTL=3600)
# shutdown_wait                     - active batch 대기 ms                (기본: CFG_DEF_SHUTDOWN_WAIT=30000)
# retry_max                         - PENDING 재처리 상한                 (기본: CFG_DEF_RETRY_MAX=5)
[worker]
ttl_sec=3600
shutdown_wait=30000
retry_max=5

# count                             - 워커 스레드 수                      (기본: CFG_DEF_COUNT=10)
[threads]
count=10

[data]
file=link.psf

# geodetic                          - 측지계 1~4                           (기본: CFG_DEF_GEODETIC=1)
# radius                            - 검색 반경 m                          (기본: CFG_DEF_RADIUS=50)
# radius_scale                      - scale×ACCURACY_M					  (기본: CFG_DEF_RADIUS_SCALE=2.5)
# radius_min                        - 적응형 하한 m						   (기본: CFG_DEF_RADIUS_MIN=20)
# radius_max                        - 적응형 상한 (cap) m                  (기본: radius 값). 2.5×acc 최대치. 20~30m 밴드 확대 위해 75
# radius_skip                       - 수평오차 SKIP m                      (초과 시 제외). 정확도 등급제: 50 초과만 제외(15~50m는 반경확대·저신뢰로 활용)
# alt_gap                           - 고도 허용차 m                        (기본: CFG_DEF_ALT_GAP=8) (2026-07-21 최정우 수정 — altitude_gap 이름 변경)
# alt_penalty                       - 고도·ROAD_TYPE 보조 비용. 양수=불일치 페널티·음수=일치 보너스
#                                      (기본: CFG_DEF_ALT_PENALTY=10) (2026-07-21 최정우 수정 — altitude_bonus/altitude_penalty 통합)
# alt_weight                        - 고도차가 alt_gap 초과 시 1m당 추가비용 배율. 0=고도 보조 점수 기능 전체 비활성
#                                      (기본: CFG_DEF_ALT_WEIGHT=0.5) (2026-07-21 최정우 수정 — altitude_weight 이름 변경)
# alt_slope                         - 고도 신뢰도 임계값 — |직전·현재 고도차(m)| ÷ 수평이동거리(m) 비율이 이 값을
#                                      초과하면 GPS 고도값을 불신하여 이번 포인트는 고도 보조 점수를 적용하지 않음(0)
#                                      예) 50m 이동 중 고도 20m 변화 → 기울기 0.4 > 0.12 → 고도 무시
#                                      (기본: CFG_DEF_ALT_SLOPE=0.12) (2026-07-21 최정우 수정 — altitude_slope 이름 변경)
# reverse_confirm                   - 연속 역행(위치 역행 + heading 도 역방향 일치) 확정 포인트 수. 미만이면 노이즈로 보고
#                                      SKIP 저장·세션 앵커 고정, 이상이면 실제 이동으로 확정하고 앵커 재설정
#                                      (기본: CFG_DEF_REVERSE_CONFIRM=3) (2026-07-21 최정우 추가 — 역행(dip) 실시간 판정 대체)
#                                      (2026-07-22 최정우 수정 — reverse_weight/speed/margin 은 실제 판정(SKIP/MATCHED)에
#                                      영향을 주지 않는 죽은 파라미터로 확인되어 소스와 함께 제거)
# opp_streakmax                     - 왕복분리 반대편 링크로 연속 오매칭되는 걸 허용하는 최대 틱 수. 이 안에
#                                      원래 링크로 복귀하면 그동안 틱을 SKIP 재기록(과금 미반영), 넘으면 실제
#                                      전이로 인정 (기본: CFG_DEF_OPP_STREAKMAX=3) (2026-08-24 최정우 추가 —
#                                      저속(speed_low_kmh 이하) 구간은 방위각을 안 써서 왕복분리 반대편 링크가
#                                      물리적으로 붙어있으면 GPS 튐만으로 여러 틱 연속 반대편에 붙을 수 있음)
# speed_factor                      - 이동거리 환산속도/SPEED_KMH 배율 상한. 0=비활성
#                                      (기본: CFG_DEF_SPEED_FACTOR=2.0) (2026-07-21 최정우 수정 — speed_diff_factor 이름 변경)
# speed_margin                      - 위 배율에 더하는 여유분(km/h, 노이즈 허용)
#                                      (기본: CFG_DEF_SPEED_MARGIN=25) (2026-07-21 최정우 수정 — speed_diff_margin 이름 변경)
# maxstep                           - 연속 링크 탐색 depth 기본값          (필수 >0)
#                                      실제 depth = maxstep + 공백적응 확장(MM_STEP_EXTEND_MAX 까지)
#                                      2026-08-22 2→4 상향. 신규 표준노드링크가 교차로를 여러 노드로
#                                      쪼개 전국 링크의 29%가 15m 미만이라, 한 틱에 3~4개 링크를
#                                      건너뛰는 전이가 흔함. 실측(21트립·전이 200건) 결과 depth 부족으로
#                                      경로 복원 실패가 도달가능 158건 중 51건(32.3%)이었고, 4로 올리면
#                                      17건(10.8%)으로 줄어듦. 공백적응은 이동거리 기준이라 저속
#                                      교차로 통과(이동 12m·4hop 등)에서 작동하지 않아 기본값 상향이 필요.
#                                      노드 평균 분기수 1.345 로 depth 상향 비용은 작음
# hoppenalty                        - depth 1단계당 가산 비용(m), 0=비활성      (기본: MM_HOP_PENALTY=8.0)
#                                      후보를 거리+방위각으로만 겨루면, 직전 링크에서 3 hop 떨어진
#                                      2.3m 후보가 1 hop 5.2m 후보를 이겨 물리적으로 불가능한 우회
#                                      경로가 선택된다(실측 연속 3점 42건 중 8건, 19%).
#                                      hop 1개당 이 값을 가산해 멀리 돌아가는 후보를 불리하게 만든다.
#                                      교차로 분할 링크가 9~12m 라 8m 로 잡았다 — 정상적인 1 hop
#                                      전진은 거의 영향이 없고 3 hop 우회는 24m 를 더 문다.
#                                      적용 결과: 링크 변경 42→17건, 우회 8→4건, 역행 16→14건.
# distance                          - Heading 유효거리 m				   (기본: CFG_DEF_DISTANCE=500)
# ignore_rawvld                     - 1이면 RAW_VLD 검사를 건너뛰고 전 좌표에 맵매칭 시도 (기본: 0)
#                                     운영 데이터 전량 검증용 스위치. 켜면 RAW_VLD=false 좌표
#                                     (실주행의 15.5%)도 매칭 대상이 되고, 그 좌표가 실제로 쓸 만한지는
#                                     엔진의 보완 로직(역행 확정·이상속도·클램프 저신뢰·hop 페널티)이
#                                     걸러내는지로 판별한다. 운영에서는 0으로 둔다 (2026-08-23 최정우 추가)
# timeout                           - 1건 처리 임계 ms                     (기본: CFG_DEF_TIMEOUT=200)
[mapmatch]
geodetic=2
radius=50
radius_scale=2.5
radius_min=20
radius_max=75
radius_skip=50
# 고도 허용차 m
alt_gap=8
# 고도·ROAD_TYPE 보조 비용. 양수=불일치 페널티·음수=일치 보너스
alt_penalty=10
# 고도차가 alt_gap 초과 시 1m당 추가비용 배율. 0=고도 보조 점수 기능 전체 비활성
alt_weight=0.5
# 고도 신뢰도 임계값 — |직전·현재 고도차(m)| ÷ 수평이동거리(m) 비율이 이 값을 초과하면
# GPS 고도값을 불신하여 이번 포인트는 고도 보조 점수를 적용하지 않음(0)
alt_slope=0.12
reverse_confirm=4
opp_streakmax=3
# 허용 상한(km/h) = 신고된속도 × speed_factor + speed_margin
speed_factor=2.0
speed_margin=25
maxstep=4
hoppenalty=8.0
# hoppenalty_lenratio               - hop 벌점의 링크길이 비례 상한 배율, 0=비활성(현행)
#                                     hoppenalty 는 우회 매칭을 막으려고 넣었는데(2026-08-22)
#                                     짧은 지선을 정상 통과하는 경우까지 같은 벌점을 문다.
#                                     7m 링크에 8m 벌점이면 링크보다 벌점이 커서, 차가 그 위에
#                                     있어도 직전 링크가 이긴다 — 합성 실측에서 짧은 지선 진입
#                                     7건 중 3건(42.9%)이 그렇게 누락됐다(전부 직전 링크 잔류).
#                                     값을 주면 벌점을 min(hoppenalty, 링크길이 x ratio) 로 깎는다
#                                     (2026-08-23 최정우 추가)
hoppenalty_lenratio=0.0
distance=500
ignore_rawvld=0
timeout=200

# gate_reload                       - 게이트(base_tollgate)+구역(base_roadlink) 캐시 재조회 주기 sec, 0=재조회 없음
#                                     (기동 시 1회만 로드). 두 캐시 모두 CChargeDataLoader 소관이라 같은 주기 공용
#                                     (2026-08-12 최정우 추가 — DB 커넥션 풀이 워커 10개+여유 1~3개(minconnect=11/
#                                     maxconnect=13)로 빡빡해서, 구현 시 반드시 best-effort(풀 바쁘면 이번 주기
#                                     스킵, 워커 처리 방해 금지) 방식으로 재조회할 것. 10분(600s)이면 게이트·구역이
#                                     드물게 바뀌는 상황엔 충분하다고 판단)
# park_pad                          - 구역판정 시 폴리곤 바깥으로 확장 허용하는 최대 거리(m, ACCURACY_M 캡)
#                                     — 폴리곤 안쪽은 무조건 인정, 바깥쪽만 이 값만큼 유예           (기본: CFG_DEF_PARK_PAD=15)
#                                     (2026-09-03 최정우 수정 — park_buf 에서 개명. "buf"는 안팎 어느 쪽
#                                     오차인지 불명확해 바깥쪽으로만 여유를 준다는 의미를 이름에 담음)
#                                     실측 검증(2026-09-03, 판교 RL-Z00001 1트립 + 강릉 RL-Z00014 3트립,
#                                     정상 정확도(≤20m) 구간 기준): 폴리곤 밖 이탈 최대 3.8m, 판교는 0m.
#                                     ~2.6배 여유를 두고 10 으로 하향(기존 15는 미검증 추정치였음) —
#                                     표본 4건뿐이라 실사용자 데이터 축적 시 재검증 권장
# park_accmax                       - 주정차 판정에 쓸 좌표의 ACCURACY_M 상한(m), 0=비활성   (기본: CFG_DEF_PARK_ACCMAX=50)
#                                     측위 실패 시 단말이 셀 기반 대체 위치로 수백 m 점프한 뒤 그 좌표에
#                                     얼어붙는다. 실측(실주행 11트립, analysis/rawvld_realcheck.py —
#                                     앞뒤 신뢰점을 도로 형상 따라 보간해 참위치를 추정, leave-one-out
#                                     링크일치 93.9%):
#                                       16~50   추정오차 중앙 8.6m  — 폴리곤 오판정 0건 (살린다)
#                                       51~100  추정오차 중앙 34.7m — 폴리곤 판정 17건 전부 허위 진입
#                                       101~    추정오차 중앙 189m·최대 486m, 좌표 동결률 64.6%
#                                     park_pad 로는 못 막는다 — 이 값은 "얼마나 여유를 줄까"이지
#                                     "이 좌표를 믿을까"가 아니라, 좌표가 200m 틀리면 소용없다.
#                                     맵매칭에는 영향 없음 — 걸러지는 행은 전부 RAW_VLD=false 라
#                                     이미 SKIP 되고, 매칭을 타는 RAW_VLD=true 는 accuracy<=15 라
#                                     이 게이트에 걸릴 수 없다 (2026-08-23 최정우 추가)
# park_exitcnt                      - 구역 이탈 확정 연속 GPS 건수(디바운스)                (기본: CFG_DEF_PARK_EXITCNT=3)
# node_exitcnt                      - 일반도로(NODE_STEP) 이탈 확정 연속 GPS 건수(디바운스) (기본: CFG_DEF_NODE_EXITCNT=3)
#                                      순간 오매칭 1틱으로 세션이 쪼개지는 것 방지 (2026-08-24 최정우 추가)
# park_speedmax                    - 주정차 판정 속도 상한(km/h), 0=비활성                (기본: CFG_DEF_PARK_SPEEDMAX=0)
#                                      0 이면 속도를 보지 않고 폴리곤 진입·진출 사실만 등록한다(기본).
#                                      이 엔진은 구역 진입 사실을 등록만 하고 과금 처리는 과금서버가
#                                      하므로, "이 속도면 정차인가" 같은 위반 판정 정책은 엔진이 갖지
#                                      않는다(2026-08-13 체류시간 임계 게이팅 제거와 동일 취지).
#                                      과금서버는 dist_m / stay_seconds / speed_kmh(평균속도)로
#                                      통과·정차를 구분할 수 있다. 실측상 정차 0km/h, 통과 11~52km/h.
#                                      엔진 단에서 줄여야 할 때만 0 보다 큰 값을 준다.
# park_entrycnt                     - 주정차 세션 개시 연속 GPS 건수                       (기본: CFG_DEF_PARK_ENTRYCNT=3)
#                                      조건을 연속으로 이만큼 충족해야 세션을 연다. GPS 주기가 3초라
#                                      3건이면 약 6초. 1~2건짜리는 체류시간 산출이 불가능하고 GPS 튐과
#                                      구분되지 않는다(실측 1점 구간 6개·2점 구간 2개). 실제 주차 5건은
#                                      모두 13건(75초) 이상이라 3으로 안전하게 갈린다.
# 주정차 판정은 구역 진입/이탈만 봄(속도 무관) — 체류시간(stay_seconds)은 항상 사실 그대로
# 기록만 하고, 위반 확정(유예시간 등)·서행 여부 판단은 dist_m/speed_kmh 로 과금서버가 함
# (2026-08-13 최정우 — park_dwell 에 이어 park_speed 도 같은 이유로 제거)
# park_regrace                      - 주정차구역 재진입 유예시간 sec, park_exitcnt 디바운스 통과 후에도
#                                     "무존" 상태면 이 시간 동안 확정 마감을 미루고 대기 — 그 안에 같은
#                                     구역으로 복귀하면 하나로 병합(잠깐 버퍼 주행 후 복귀 등)      (기본: CFG_DEF_PARK_REGRACE=60)
# exempt_regrace                    - 면제도로 재진입 유예시간 sec, 위와 동일 개념             (기본: CFG_DEF_EXEMPT_REGRACE=60)
# park_ttl                          - 열려있는 주정차 세션의 마지막 신뢰(RAW_VLD=true) 확인 이후
#                                     이 시간(sec)이 지나면, 좌표 확인 없이 그 마지막 신뢰 시점
#                                     기준으로 강제 마감(0=비활성). GPS 자체는 계속 들어오는데
#                                     RAW_VLD=false만 계속돼 정상 이탈/트립종료 신호가 오지 않는
#                                     경우의 안전장치 — 세션(디바이스)은 안 지우고 주정차 상태만
#                                     리셋한다(전체 세션 TTL=ttl_sec 와는 별개)  (기본: CFG_DEF_PARK_TTL=600, 2026-08-21
#                                     최정우 수정 — 실측 raw_vld=false 최장 269초 대비 여유 확보, 기존 90은 GPS 신호저하만으로
#                                     동일 체류가 2건으로 분리되는 오탐 유발)
[charge]
gate_reload=600
park_pad=10
park_accmax=50
park_exitcnt=3
node_exitcnt=3
park_speedmax=0
park_entrycnt=3
park_regrace=60
park_ttl=600
exempt_regrace=60
