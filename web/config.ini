# RUC 맵매칭 GPS 시각화 웹 (2026-07-10 최정우)
# 실행: web/run.sh

[database]
host=127.0.0.1
port=5432
name=roadnet
userid=mytobcom
password=my664761
# Simulator/MapMatchSvr 가 2026-08-11 GPS/매칭 데이터를 local ruc DB(schema: ruc)로 전환함.
# 도로망(network.moct_link, roadnet.prim_link_info)은 아직 roadnet DB에 있어 별도 연결 유지 (2026-08-12 최정우 추가)
points_name=ruc

# 원격 ruc DB(실서비스 DB) — 조회 전용. get_conn_remote() 가 세션 자체를
# default_transaction_read_only=on 으로 열어, 여기 쓰는 라우트에서 실수로 쓰기 SQL을
# 넣어도 DB가 거부하게 만든 안전장치 (2026-08-18 최정우 추가)
[remote_database]
host=59.11.91.162
port=5432
name=ruc
userid=ruc
password=ruc

[web]
# 웹 서버 포트. 8088 = Windows 8088→8088 포트포워딩 시 http://localhost:8088/ 접속 (실행 시 root 필요)
port=8088
# trip GPS 궤적 bbox 에 더하는 도로망 버퍼 (m). 추후 조정 가능
road_buffer_m=1000
# GPS/매칭 점 자동 갱신 주기 (초). 0=비활성
poll_sec=5
# 과금 구역이 LINE(선)일 때 원시 GPS 가 그 구역 안에 있다고 볼 허용 거리(m).
#   아래 패널의 G 순번 범위 판정에 사용 — POLY(주정차)는 폴리곤 포함 판정이라 무관
zone_line_buf_m=20
