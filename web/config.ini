# RUC 맵매칭 GPS 시각화 웹 (2026-07-10 최정우)
# 실행: web/run.sh

[database]
host=127.0.0.1
port=5432
name=roadnet
userid=mytobcom
password=my664761
# Simulator/MapMatchSvr 가 2026-08-11 GPS/매칭 데이터를 local ruc DB(schema: ruc)로 전환함.
# 도로망(network.moct_link, roadnet.prim_link_info)은 아직 roadnet DB에 있어 별도 연결 유지 (2026-08-12 최정우 추가)
points_name=ruc

[web]
# 웹 서버 포트. 8088 = Windows 8088→8088 포트포워딩 시 http://localhost:8088/ 접속 (실행 시 root 필요)
port=8088
# trip GPS 궤적 bbox 에 더하는 도로망 버퍼 (m). 추후 조정 가능
road_buffer_m=1000
# GPS/매칭 점 자동 갱신 주기 (초). 0=비활성
poll_sec=5
